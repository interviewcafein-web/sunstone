# Nightly copy of LMS data into the database: the PRIME students (and their status, e.g.
# debarred), their form usernames, PRIME domain assessments + AMCAT results, attendance and internal exams.
# Needs repository secrets DATABASE_URL, REDASH_KEY and SHEET_ID; skips until they exist.
# Run it by hand from the Actions tab ("Run workflow") after adding them.

name: Sync LMS data

on:
  schedule:
    - cron: '0 20 * * *' # 01:30 India time
  workflow_dispatch:

concurrency:
  group: sync-lms
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDASH_KEY: ${{ secrets.REDASH_KEY }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      # For the new-test emails; without them the notices still go to the bell.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      # The PRIME delivery tracker (Supabase Postgres); the step is skipped until it is set.
      DELIVERY_DATABASE_URL: ${{ secrets.DELIVERY_DATABASE_URL }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$REDASH_KEY" ] || [ -z "$SHEET_ID" ]; then
            echo "Secrets DATABASE_URL, REDASH_KEY and SHEET_ID are not all set; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - name: Students from the LMS (+ form usernames)
        if: steps.secrets.outputs.ready == 'true'
        run: npx tsx scripts/import-students.ts
      - name: Campus logos
        if: steps.secrets.outputs.ready == 'true'
        run: npx tsx scripts/sync-campuses.ts
      - name: PRIME domain assessments and AMCAT
        if: steps.secrets.outputs.ready == 'true'
        run: npx tsx scripts/sync-assessments.ts
      - name: Class attendance
        if: steps.secrets.outputs.ready == 'true'
        run: npx tsx scripts/sync-attendance.ts
      - name: Internal exams
        if: steps.secrets.outputs.ready == 'true'
        run: npx tsx scripts/sync-exams.ts
      - name: PRIME delivery (classes taught against allocated hours)
        if: steps.secrets.outputs.ready == 'true' && env.DELIVERY_DATABASE_URL != ''
        run: npx tsx scripts/sync-delivery.ts
      - name: Ready-made pages (campus pages, campus list, 360°) so they open at once
        if: steps.secrets.outputs.ready == 'true'
        run: npx tsx scripts/warm-snapshots.ts
      - name: Tell campuses about new tests (bell + email, HQ copied)
        if: steps.secrets.outputs.ready == 'true'
        run: npx tsx scripts/notify-new-tests.ts
