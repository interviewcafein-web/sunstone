<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/converge-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a3e70" />
    <!-- Internal dashboard listing students by name: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Converge 2026 · Sunstone PRIME</title>
    <meta
      name="description"
      content="Student progress for Sunstone PRIME management students (BBA, MBA): PRIME domains, communication and aptitude, AMCAT, internal marks, attendance and Super 100."
    />

    <!--
      Link previews (WhatsApp, LinkedIn, Slack). Crawlers do not run JavaScript, so these must
      be in the HTML; middleware.ts serves this page to Converge's addresses. The image is on
      the shared deployment (__SITE_URL__), so it loads whatever address shared the link.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sunstone PRIME" />
    <meta property="og:title" content="Converge 2026 · Sunstone PRIME" />
    <meta
      property="og:description"
      content="Every future manager, in one view: PRIME domains, communication and aptitude, AMCAT, internal marks, attendance and Super 100 for Sunstone PRIME's BBA and MBA students."
    />
    <meta property="og:image" content="__SITE_URL__/og-image-converge.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image-converge.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Converge 2026 by Sunstone PRIME: every future manager, in one view"
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Converge 2026 · Sunstone PRIME" />
    <meta
      name="twitter:description"
      content="PRIME domains, communication and aptitude, AMCAT, internal marks, attendance and Super 100 for BBA and MBA students."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image-converge.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/converge/main.tsx"></script>
  </body>
</html>
