<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vertex-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a3e70" />
    <!-- Internal dashboard listing students by name: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Sunstone PRIME Vertex</title>
    <meta
      name="description"
      content="Student progress intelligence for Sunstone PRIME: coding practice, zones, campus reports and resources across every campus."
    />

    <!--
      Link previews (WhatsApp, LinkedIn, Slack, X). Crawlers do not run JavaScript, so these
      must be in the HTML, and the image URL must be absolute: __SITE_URL__ is filled in at
      build time (see vite.config.ts).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sunstone" />
    <meta property="og:title" content="Sunstone PRIME Vertex" />
    <meta
      property="og:description"
      content="Student progress intelligence for Sunstone PRIME: coding practice, zones, campus reports and resources across every campus."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image-vertex.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image-vertex.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sunstone PRIME Vertex: student progress intelligence for Sunstone PRIME"
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sunstone PRIME Vertex" />
    <meta
      name="twitter:description"
      content="Student progress intelligence for Sunstone PRIME, across every campus."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image-vertex.jpg" />

    <link rel="preload" as="image" href="/sunstone-logo.png" />
    <link rel="preload" as="image" href="/vertex-logo-white-ink.png" />
    <link rel="preload" as="image" href="/vertex-logo-gold.png" />

    <!-- Saved theme (see src/lib/theme.ts), applied before the first paint so it never flashes. -->
    <script>
      try {
        if (localStorage.getItem('sunstone:theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1426');
        }
      } catch (error) {}
    </script>

    <!--
      Intro animation. Inline so it paints before the app's JavaScript loads and covers that
      wait. Plays once per browser session; main.tsx calls window.__hideSplash() once the app
      has rendered, and the CSS removes it on its own after 6s if the app never does.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(60vmax 40vmax at 80% 10%, #3863a0 0%, transparent 60%),
          radial-gradient(50vmax 40vmax at 0% 100%, #274f87 0%, transparent 55%), #1a3e70;
        color: #fff;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        animation: splash-out 0.5s ease-in 6s forwards;
      }
      html.splash-seen #splash {
        display: none;
      }
      #splash.splash-leave {
        animation: splash-out 0.55s cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }
      /*
        The Vertex logo draws itself, one piece at a time: two copies of the logo (white parts
        and gold parts, same size, stacked), each shown through a clip that opens up. Positions
        are percentages of the 1247x445 logo: left arm 0-15.5%, gold stroke 14.5-30.5%, right
        arm 14.5-39.5%, letters from 40%, gold X accent from 90%.
      */
      .vx {
        position: relative;
        width: min(300px, 70vw);
        aspect-ratio: 1247 / 445;
        animation: vx-glow 1.4s ease-in-out 1.75s;
      }
      .vx img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .vx-left {
        clip-path: inset(0 84.5% 57% 0);
        animation: vx-left 0.45s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
      }
      .vx-stroke {
        clip-path: inset(100% 69.5% 0 14.5%);
        animation: vx-stroke 0.5s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
      }
      .vx-right {
        clip-path: inset(0 85.5% 0 14.5%);
        animation: vx-right 0.5s cubic-bezier(0.65, 0, 0.35, 1) 0.75s forwards;
      }
      .vx-word {
        clip-path: inset(0 60% 0 40%);
        transform: translateX(-6px);
        animation: vx-word 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.1s forwards;
      }
      .vx-accent {
        clip-path: inset(0 0 0 90%);
        opacity: 0;
        transform: translate(-4%, 8%);
        animation: vx-accent 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 1.55s forwards;
      }
      /* A soft light running across the gold, once the logo is complete. */
      .vx-shine {
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, transparent 40%, #fff7d6 50%, transparent 60%) no-repeat;
        background-size: 300% 100%;
        background-position: 150% 0;
        -webkit-mask: url(/vertex-logo-gold.png) center / 100% 100% no-repeat;
        mask: url(/vertex-logo-gold.png) center / 100% 100% no-repeat;
        animation: vx-shine 1.1s ease-in-out 1.85s;
      }
      /* Sunstone PRIME, small, under the Vertex logo. */
      .splash-lockup {
        display: flex;
        flex-direction: column;
        gap: 7px;
        width: min(170px, 44vw);
        margin-top: 4px;
        opacity: 0;
        animation: splash-rise 0.5s ease-out 1.7s forwards;
      }
      .splash-logo {
        width: 100%;
        height: auto;
        filter: brightness(0) invert(1);
        opacity: 0.92;
      }
      /* PRIME sits under the wordmark (right of the 19% mark), between two gold rules. */
      .splash-prime {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 21%;
      }
      .splash-prime span {
        flex: 1;
        height: 1px;
        transform: scaleX(0);
        animation: splash-rule 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.9s forwards;
      }
      .splash-prime span:first-child {
        background: linear-gradient(to right, transparent, #fcd34d);
        transform-origin: right;
      }
      .splash-prime span:last-child {
        background: linear-gradient(to left, transparent, #fcd34d);
        transform-origin: left;
      }
      .splash-prime b {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.55em;
        margin-right: -0.55em;
        background: linear-gradient(90deg, #fde68a, #fbbf24 50%, #fde68a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .splash-bar {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: rgb(255 255 255 / 0.18);
        overflow: hidden;
        opacity: 0;
        animation: splash-rise 0.4s ease-out 2s forwards;
      }
      .splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #fcd34d;
        animation: splash-sweep 1s ease-in-out 2s infinite;
      }
      @keyframes vx-left {
        from {
          clip-path: inset(0 84.5% 57% 0);
        }
        to {
          clip-path: inset(0 84.5% 0 0);
        }
      }
      @keyframes vx-stroke {
        from {
          clip-path: inset(100% 69.5% 0 14.5%);
        }
        to {
          clip-path: inset(0 69.5% 0 14.5%);
        }
      }
      @keyframes vx-right {
        from {
          clip-path: inset(0 85.5% 0 14.5%);
        }
        to {
          clip-path: inset(0 60.5% 0 14.5%);
        }
      }
      @keyframes vx-word {
        from {
          clip-path: inset(0 60% 0 40%);
          transform: translateX(-6px);
        }
        to {
          clip-path: inset(0 0 0 40%);
          transform: none;
        }
      }
      @keyframes vx-accent {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes vx-shine {
        from {
          background-position: 150% 0;
        }
        to {
          background-position: -50% 0;
        }
      }
      @keyframes vx-glow {
        50% {
          filter: drop-shadow(0 0 14px rgb(252 211 77 / 0.45));
        }
      }
      @keyframes splash-rule {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes splash-out {
        to {
          opacity: 0;
          transform: translateY(-3%);
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        .vx,
        .vx img,
        .vx-shine,
        .splash-lockup,
        .splash-prime span,
        .splash-bar,
        .splash-bar::after {
          animation: none;
        }
        .vx img {
          clip-path: none;
          opacity: 1;
          transform: none;
        }
        .vx-shine {
          display: none;
        }
        .splash-prime span {
          transform: none;
        }
        .splash-lockup,
        .splash-bar {
          opacity: 1;
        }
        #splash.splash-leave {
          display: none;
        }
      }
    </style>
    <script>
      (function () {
        var seen = false;
        try {
          seen = sessionStorage.getItem('sunstone:splash-seen') === '1';
          sessionStorage.setItem('sunstone:splash-seen', '1');
        } catch (error) {}
        if (seen) document.documentElement.classList.add('splash-seen', 'splash-gone');

        var start = Date.now();
        // Long enough for the Vertex logo to finish drawing, but never longer than needed.
        var minimum = seen || matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 2600;
        window.__hideSplash = function () {
          var splash = document.getElementById('splash');
          if (!splash) return;
          setTimeout(
            function () {
              document.documentElement.classList.add('splash-gone');
              splash.classList.add('splash-leave');
              setTimeout(function () {
                splash.remove();
              }, 600);
            },
            Math.max(0, minimum - (Date.now() - start))
          );
        };
      })();
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="vx">
        <img class="vx-left" src="/vertex-logo-white-ink.png" alt="" />
        <img class="vx-stroke" src="/vertex-logo-gold.png" alt="" />
        <img class="vx-right" src="/vertex-logo-white-ink.png" alt="" />
        <img class="vx-word" src="/vertex-logo-white-ink.png" alt="" />
        <img class="vx-accent" src="/vertex-logo-gold.png" alt="" />
        <div class="vx-shine"></div>
      </div>
      <div class="splash-lockup">
        <img class="splash-logo" src="/sunstone-logo.png" alt="" width="886" height="115" />
        <div class="splash-prime"><span></span><b>PRIME</b><span></span></div>
      </div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
