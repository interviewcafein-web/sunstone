<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sunstone-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a3e70" />
    <!-- Internal dashboard listing students by name: keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Sunstone PRIME - Coding Profiles</title>
    <meta
      name="description"
      content="Every Sunstone student's LeetCode, GeeksforGeeks, HackerRank, Codeforces, CodeChef and GitHub progress in one place, by campus and batch."
    />

    <!--
      Link previews (WhatsApp, LinkedIn, Slack, X). Crawlers do not run JavaScript, so these
      must be in the HTML, and the image URL must be absolute: __SITE_URL__ is filled in at
      build time (see vite.config.ts).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sunstone" />
    <meta property="og:title" content="Sunstone PRIME · Coding Profiles" />
    <meta
      property="og:description"
      content="Every student's LeetCode, GeeksforGeeks, HackerRank, Codeforces, CodeChef and GitHub progress in one place, by campus and batch."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image-prime.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image-prime.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sunstone PRIME Coding Profiles, with the LeetCode, GeeksforGeeks, HackerRank, Codeforces, CodeChef and GitHub logos"
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sunstone PRIME · Coding Profiles" />
    <meta
      name="twitter:description"
      content="Every student's coding progress across six platforms, by campus and batch."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image-prime.jpg" />

    <link rel="preload" as="image" href="/sunstone-logo.png" />

    <!--
      Intro animation. Inline so it paints before the app's JavaScript loads and covers that
      wait. Plays once per browser session; main.tsx calls window.__hideSplash() once the app
      has rendered, and the CSS removes it on its own after 6s if the app never does.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(60vmax 40vmax at 80% 10%, #3863a0 0%, transparent 60%),
          radial-gradient(50vmax 40vmax at 0% 100%, #274f87 0%, transparent 55%), #1a3e70;
        color: #fff;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        animation: splash-out 0.5s ease-in 6s forwards;
      }
      html.splash-seen #splash {
        display: none;
      }
      #splash.splash-leave {
        animation: splash-out 0.55s cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }
      .splash-lockup {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(320px, 70vw);
      }
      .splash-logo {
        width: 100%;
        height: auto;
        filter: brightness(0) invert(1);
        /* Mark first (the left 19%), then the wordmark wipes in after it. */
        clip-path: inset(0 100% 0 0);
        animation:
          splash-mark 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards,
          splash-word 0.6s cubic-bezier(0.65, 0, 0.35, 1) 0.6s forwards;
      }
      /* PRIME sits under the wordmark (right of the 19% mark), between two gold rules. */
      .splash-prime {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-left: 21%;
      }
      .splash-prime span {
        flex: 1;
        height: 1px;
        transform: scaleX(0);
        animation: splash-rule 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
      }
      .splash-prime span:first-child {
        background: linear-gradient(to right, transparent, #fcd34d);
        transform-origin: right;
      }
      .splash-prime span:last-child {
        background: linear-gradient(to left, transparent, #fcd34d);
        transform-origin: left;
      }
      .splash-prime b {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.55em;
        margin-right: -0.55em;
        background: linear-gradient(90deg, #fde68a, #fbbf24 50%, #fde68a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: 0;
        animation: splash-prime 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
      }
      .splash-tagline {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #b5cae6;
        opacity: 0;
        animation: splash-rise 0.5s ease-out 1.35s forwards;
      }
      .splash-bar {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: rgb(255 255 255 / 0.18);
        overflow: hidden;
        opacity: 0;
        animation: splash-rise 0.4s ease-out 1.5s forwards;
      }
      .splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #fff;
        animation: splash-sweep 1s ease-in-out 1.5s infinite;
      }
      @keyframes splash-mark {
        from {
          clip-path: inset(0 100% 0 0);
          transform: translateY(6px) scale(0.96);
        }
        to {
          clip-path: inset(0 81% 0 0);
          transform: none;
        }
      }
      @keyframes splash-word {
        from {
          clip-path: inset(0 81% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes splash-rule {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes splash-prime {
        from {
          opacity: 0;
          letter-spacing: 0.15em;
          margin-right: -0.15em;
        }
        to {
          opacity: 1;
          letter-spacing: 0.55em;
          margin-right: -0.55em;
        }
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes splash-out {
        to {
          opacity: 0;
          transform: translateY(-3%);
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        .splash-logo,
        .splash-prime span,
        .splash-prime b,
        .splash-tagline,
        .splash-bar,
        .splash-bar::after {
          animation: none;
        }
        .splash-prime span {
          transform: none;
        }
        .splash-prime b {
          opacity: 1;
        }
        .splash-logo {
          clip-path: none;
        }
        .splash-tagline,
        .splash-bar {
          opacity: 1;
        }
        #splash.splash-leave {
          display: none;
        }
      }
    </style>
    <script>
      (function () {
        var seen = false;
        try {
          seen = sessionStorage.getItem('sunstone:splash-seen') === '1';
          sessionStorage.setItem('sunstone:splash-seen', '1');
        } catch (error) {}
        if (seen) document.documentElement.classList.add('splash-seen', 'splash-gone');

        var start = Date.now();
        // Long enough for the logo to finish drawing, but never longer than needed.
        var minimum = seen || matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1900;
        window.__hideSplash = function () {
          var splash = document.getElementById('splash');
          if (!splash) return;
          setTimeout(
            function () {
              document.documentElement.classList.add('splash-gone');
              splash.classList.add('splash-leave');
              setTimeout(function () {
                splash.remove();
              }, 600);
            },
            Math.max(0, minimum - (Date.now() - start))
          );
        };
      })();
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-lockup">
        <img class="splash-logo" src="/sunstone-logo.png" alt="" width="886" height="115" />
        <div class="splash-prime"><span></span><b>PRIME</b><span></span></div>
      </div>
      <div class="splash-tagline">Coding Profiles</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
